# Rubidium — full example configuration (all known options)
#
# Put this in e.g.:
#   ~/printer_data/config/rubidium/ubidium_full.cfg
# and include it from printer.cfg with:
#   [include rubidium/rubidium_full.cfg]
#
# Notes:
# - Values can be placed either in [rubidium] (shared defaults) or in the per-mode section.
#   Each mode uses [rubidium] as its base, then overrides with its own section.
# - Only one unnamed [rubidium print]/[rubidium scan]/[rubidium analyse]/[rubidium latency] is supported right now.
# - [rubidium pattern] or [rubidium print] is the default pattern. Use [rubidium pattern <name>] for additional named patterns.


# -----------------------------------------------------------------------------
# Base / shared defaults
# -----------------------------------------------------------------------------
[rubidium]
# -------------------- motion defaults --------------------
# Default travel speed (mm/s) for G0 moves inside rubidium-generated gcode
travel_speed: 150.0

# Offsets applied to ALL generated coordinates (print + scan)
offset_x: 0.0
offset_y: 0.0
offset_z: 0.0

# -------------------- run output directories --------------------
# If output_dir is omitted, rubidium defaults to <config_dir>/rubidium
# (config_dir is usually ~/printer_data/config/)
output_dir: ~/printer_data/config/rubidium

# Optional explicit subdirectories (defaults shown)
scan_dir:     ~/printer_data/config/rubidium/scan
analysis_dir: ~/printer_data/config/rubidium/analysis

# Folder naming for scan/analyse sessions (Python strftime format)
run_dir_format: %Y%m%d_%H%M%S

# -------------------- shared gcode templates --------------------
# These are rendered and emitted by print/scan.
# If you don't need templating, treat them as plain gcode blocks.
#
# Template context always includes:
#   mode, travel_speed, scan_speed, scan_buffer, pattern, pattern_settings,
#   pattern_segments, speeds, line (print/scan), scan (scan only)
#
# start_gcode runs once at the beginning
# before_line_gcode runs before each line
# after_line_gcode runs after each line
# end_gcode runs once at the end



# -----------------------------------------------------------------------------
# Pattern definitions
# -----------------------------------------------------------------------------

# Default pattern (used when you do not pass PATTERN=...)
[rubidium print] # or [rubidium pattern]
# Currently supported: lines
pattern: lines

# -------------------- pattern_segments --------------------
# A sequence of segments: <tag>: <weight>
# - weights are normalized to sum to 1.0
# - <tag> can be a speed label (looked up in "speeds") OR a direct numeric speed in mm/s.
#
# Example (labels):
pattern_segments:
    slow: 0.25,
    medium: 0.50,
    slow: 0.25

# Example (direct mm/s in the tag):
# pattern_segments:
#     30: 0.50,
#     60: 0.50

# -------------------- Lines pattern options --------------------
# Pressure-advance (or any other parameter) sweep
param_start: 0.0
param_stop:  0.10
param_count: 10

# Which command/parameter is emitted per line (print mode uses this)
tuning_command:   SET_PRESSURE_ADVANCE
tuning_parameter: ADVANCE

# Pattern origin (mm). If omitted, origin_x/origin_y default to bed center.
# origin_z is the base Z for the generated geometry (offset_z is applied later).
origin_x: 150.0
origin_y: 150.0
origin_z: 0.0

# Geometry
layer_height: 0.20
line_length:  30.0
line_spacing: 3.0


# Another named pattern you can select with PATTERN=my_pa_test
[rubidium pattern my_pa_test]
pattern: lines
pattern_segments:
    40: 1.0
param_start: 0.00
param_stop:  0.15
param_count: 16
tuning_command:   SET_PRESSURE_ADVANCE
tuning_parameter: ADVANCE
# origin_x/origin_y omitted -> bed center
origin_z: 0.0
layer_height: 0.20
line_length:  60.0
line_spacing: 4.0


# -----------------------------------------------------------------------------
# Print mode (RUBIDIUM_PRINT)
# -----------------------------------------------------------------------------
[rubidium print]
# (You may omit travel_speed/offset_* here if you set them in [rubidium])
travel_speed: 150.0
offset_x: 0.0
offset_y: 0.0
offset_z: 0.0

# Flow multiplier applied to all extrusion (unitless)
flow: 1.0

# Default speed (mm/s) used for the optional brim walls
print_speed: 25.0

# Brim configuration (0 disables brim)
brim_walls:   2
brim_overlap: 0.0   # percent [0..100]

# Line width selection:
# - if line_width > 0: use absolute mm
# - else if line_width_pct > 0: nozzle_diameter * (pct/100)
# - else: nozzle_diameter * 1.20
line_width: 0.0
line_width_pct: 120.0

# Used for extrusion volume (mm)
layer_height: 0.20

# Speed mapping for segment labels (mm/s)
# Format: "label: value, label: value, ..."
# (tags in pattern_segments can reference these labels)
speeds:
    slow:   30,
    medium: 60,
    fast:   90

# Optional: override base templates only for print
# start_gcode:
before_line_gcode:
    {% set fast = rubidium.travel_speed * 60.0 %}
    {% if last_line and (last_line.end.x - line.start.x)|abs >= 3 or (last_line.end.y - line.start.y)|abs >= 3 %}
        G0 Z{ rubidium.line.start.z + 0.1 } F{ fast }
        G0 X{ rubidium.line.start.x } Y{ rubidium.line.start.y } F{ fast }
        G0 Z{ rubidium.line.start.z } F{ fast }
        G1 E{ 0.7 } F{ 3600 }
    {% endif %}
    SET_VELOCITY_LIMIT ACCEL=4000
# 
after_line_gcode:
    {% if next_line and (next_line.start.x - line.end.x)|abs >= 3 or (next_line.start.y - line.end.y)|abs >= 3 %}
        G1 E{ -0.7 } F{ 3600 }
        G0 Z{ rubidium.line.start.z + 0.1 } F{ rubidium.travel_speed * 60.0 }
    {% endif %}
    SET_VELOCITY_LIMIT ACCEL={ printer.configfile.settings.printer.max_accel }

# end_gcode:


# -----------------------------------------------------------------------------
# Scan mode (RUBIDIUM_SCAN)
# -----------------------------------------------------------------------------
[rubidium scan]
# Motion
travel_speed: 150.0
scan_speed:  10.0    # mm/s
scan_buffer: 0.0     # mm; 0 means "no extra buffer"
offset_x: 0.0
offset_y: 0.0
offset_z: 0.0

# Output directories (may be placed in [rubidium] instead)
output_dir: ~/printer_data/config/rubidium
scan_dir:   ~/printer_data/config/rubidium/scan
run_dir_format: %Y%m%d_%H%M%S

# -------------------- video capture (VideoInput) --------------------
# REQUIRED (must exist in [rubidium] or [rubidium scan])
video_source: http://127.0.0.1:8081/?action=stream

# auto -> treats video_source as url if it looks like one, otherwise v4l2
# url  -> ffmpeg -i <video_source>
# v4l2 -> ffmpeg -f v4l2 ... -i <video_source>
video_input_kind: auto

# Used to shift mark timestamps back in time (camera latency compensation)
# Can also be overridden per-run with VIDEO_LATENCY_MS=...
video_latency_ms: 0

# For v4l2 inputs, these are REQUIRED (and you must not pass -video_size/-framerate in video_extra_input_args)
# For url inputs, they can be omitted.
video_resolution: 1920x1080
video_framerate:  30

# Extra args injected into ffmpeg recording command.
# - video_extra_input_args: inserted before input selection (-i ...)
# - video_extra_output_args: inserted before the output path
#
# If video_extra_output_args is empty:
# - url:  "-an -c copy"
# - v4l2: "-an -c:v libx264 -preset ultrafast -crf 18 -pix_fmt yuv420p"
video_extra_input_args:
    # Example:
    # -use_wallclock_as_timestamps 1
    # -fflags +genpts

video_extra_output_args:
    # Example:
    # -an -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -movflags +faststart

# Naming policy
video_session_filename: rubidium_scan_session
video_cut_filename:     rubidium_cut
video_dump_container:   mkv

# Per-line cut args (cut output is always .mp4)
video_cut_extra_input_args:
    # Example:
    # -accurate_seek 1

# If video_cut_extra_output_args is empty, cuts default to:
#   -c:v libx264 -preset veryfast -crf 23
video_cut_extra_output_args:
    # Example:
    # -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -movflags +faststart

# Nice level used for post-processing / cutting (0..20)
video_postprocess_nice: 15

# Optional: override base templates only for scan
# start_gcode:              # ← put your LASER_ON here and off in end for example
# before_line_gcode:
# after_line_gcode:
# end_gcode:


# -----------------------------------------------------------------------------
# Analyse mode (RUBIDIUM_ANALYSE)
# -----------------------------------------------------------------------------
[rubidium analyse]
# Output directories (may be placed in [rubidium] instead)
output_dir:   ~/printer_data/config/rubidium
analysis_dir: ~/printer_data/config/rubidium/analysis
scan_dir:     ~/printer_data/config/rubidium/scan
run_dir_format: %Y%m%d_%H%M%S

# Write artifacts
analysis_write_plots: False
analysis_write_npz:   False

# Crop settings (strings parsed as numbers)
# - crop_center: "x,y" in pixels in the *reference* resolution
# - crop_size:   "w,h" in pixels (output crop size)
# - base_resolution: "w,h" reference resolution that crop_center refers to
crop_center:
crop_size:
base_resolution:

# Laser extraction HSV gate (strings parsed as ints "h,s,v")
laser_hsv_lower:
laser_hsv_upper:

# Laser extraction thresholds / filters
laser_bright_percentile: -1.0   # -1 disables percentile-based auto threshold
laser_weight_power:       4.0
laser_min_row_energy:     1.0
laser_median_ksize:       5
laser_morph_ksize:        3

# CLAHE options
laser_use_clahe:   True
laser_blur_ksize:  5
laser_clahe_clip:  3.0
laser_clahe_grid:  8, 8

# Optional: override pipeline ordering by step names (space/comma/newline separated)
# Known steps:
#   crop brightness clahe blur threshold hsv_gate morph masked_gray centroid
analysis_pipeline:

# Frame sampling controls
analysis_frame_step: 1    # analyse every Nth frame
analysis_max_frames: 0    # 0 = no limit

# Triangulation (optional)
triangulate_enable: False

# Camera calibration file path (.npz with K/dist arrays, or OpenCV FileStorage yaml)
camera_calibration:

# Planes as "a,b,c,d" (float) for ax+by+cz+d=0
laser_plane:
bed_plane:


# -----------------------------------------------------------------------------
# Latency mode (RUBIDIUM_LATENCY)
# -----------------------------------------------------------------------------
[rubidium latency]
# REQUIRED
video_source: http://127.0.0.1:8081/?action=stream

# ffmpeg path / args
ffmpeg: ffmpeg
video_input_kind: auto
video_resolution: 1920x1080
video_framerate:  30

# These strings are formatted internally with:
#   {src}  {fps}  {resx}
ffmpeg_common_args:     -hide_banner -loglevel error
ffmpeg_input_args_url:  -an -i {src}
ffmpeg_input_args_v4l2: -f v4l2 -framerate {fps} -video_size {resx} -i {src}

# Detection resolution (downscaled from incoming frames)
latency_detect_width:  160
latency_detect_height: 120

# Statistics / triggering
latency_warmup_frames:      4
latency_baseline_metrics:  30
latency_threshold_sigma:   10.0
latency_threshold_floor:    2.0
latency_consecutive:        2

# Scheduling / timeout
latency_arm_lead_s: 0.02
latency_timeout:    5.0
